<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene 3-D view</title>
<style>
  html,body{margin:0;height:100%;background:#101216;color:#c3c2b7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #info{position:fixed;top:10px;left:12px;font-size:13.5px;line-height:1.5;background:rgba(16,18,22,.86);
    padding:10px 12px;border-radius:10px;max-width:46ch;max-height:calc(100% - 40px);overflow:auto}
  #info b{color:#f0efec} a{color:#7fb2f0}
  .k{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 8px;vertical-align:middle}
  .ramp{display:flex;height:10px;width:220px;border-radius:2px;overflow:hidden;margin:4px 0 2px}
  .ramp i{flex:1}
  .rl{display:flex;justify-content:space-between;width:220px;font-size:12px;color:#898781}
  label{display:inline-block;margin-right:10px}
  ol{padding-left:0;margin:6px 0 0;list-style:none}
  ol li{margin:3px 0;cursor:pointer;display:flex;gap:6px;align-items:baseline}
  ol li:hover{color:#f0efec}
  .num{display:inline-block;min-width:18px;height:18px;border-radius:9px;text-align:center;font-size:11.5px;
    font-weight:700;line-height:18px;color:#fff;flex:none}
  .cap{position:fixed;pointer-events:auto;cursor:pointer;transform:translate(-50%,-100%);background:rgba(16,17,22,.92);
    border-left:4px solid;border-radius:6px;padding:4px 8px;font-size:12.5px;color:#f0efec;white-space:nowrap;
    max-width:260px;overflow:hidden;text-overflow:ellipsis}
  .cap small{display:block;color:#c3c2b7;white-space:normal;max-width:240px}
  .cap.dim{opacity:.55}
  .cap.compact{padding:2px 3px;border-left-width:0;background:none}
  .cap.compact .t,.cap.compact small{display:none}
  .cap.compact:hover{z-index:5000!important;background:rgba(16,17,22,.95);border-left-width:4px;padding:4px 8px}
  .cap.compact:hover .t,.cap.compact:hover small{display:inline}
  .cap.compact:hover small{display:block}
  .muted{color:#898781}
</style>
<script type="importmap">{"imports": {"three": "/vendor/three.module.js"}}</script>
</head>
<body>
<div id="info"><b>SLAM view</b> · <span id="n">loading…</span><br>
  <span class="muted">drag = orbit · right-drag = pan · wheel = zoom ·</span> <a href="./">back to report</a><br>
  <label><input type="checkbox" id="tHeat" checked> posture heat map</label>
  <label><input type="checkbox" id="tCap" checked> captions</label>
  <label><input type="checkbox" id="tOcc" checked> lidar walls</label>
  <label><input type="checkbox" id="tGraph" checked> scene graph</label><br>
  <div id="graphinfo" class="muted"></div>
  <label>ceiling cut <input type="range" id="tCeil" min="1.0" max="3.2" step="0.1" value="2.2" style="width:110px;vertical-align:middle">
    <span id="ceilv">2.2 m</span></label>
  <div id="legend"></div>
  <div><span class="k" style="background:#c3c2b7"></span>Stretch path <span class="k" style="background:#3987e5;border-radius:5px"></span>robot</div>
  <ol id="caps"></ol>
</div>
<script type="module">
import * as THREE from 'three';
const $ = (id) => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101216);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 200);
camera.up.set(0, 0, 1);  // map frame: z up

const res = await fetch('scene/points.bin');
if (!res.ok) { $('n').textContent = 'no scene map for this session'; throw new Error('no map'); }
const buf = await res.arrayBuffer();
const dv = new DataView(buf);
let off = 0;
const n = dv.getUint32(off, true); off += 4;
const xyz = new Float32Array(buf, off, n * 3); off += n * 12;
const rgb = new Uint8Array(buf, off, n * 3); off += n * 3; off += (4 - (n * 3) % 4) % 4;
const m = dv.getUint32(off, true); off += 4;
const cam = new Float32Array(buf, off, m * 3); off += m * 12;
let ov = {};
try { const r = await fetch('scene/overlay.json'); if (r.ok) ov = await r.json(); } catch (e) { /* older session */ }
const SRC = { 'registered-lidar': 'lidar SLAM + head joints + floor plane', 'registered-odometry': 'wheel odometry + head joints + floor plane',
  'kinematic+floor': 'head joints + odometry, floor-corrected', kinematic: 'head joints + odometry' };
$('n').textContent = `${n.toLocaleString()} voxels · people removed · poses: ${SRC[ov.pose_source] || ov.pose_source || 'kinematic'}`;

// --- room scan: round splats with a ceiling cut
const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.BufferAttribute(xyz, 3));
g.setAttribute('color', new THREE.BufferAttribute(rgb, 3, true));
const mat = new THREE.ShaderMaterial({
  uniforms: { voxel: { value: 0.05 }, heightPx: { value: innerHeight }, ceiling: { value: ov.ceiling_m || 2.2 } },
  vertexShader: `uniform float voxel; uniform float heightPx; uniform float ceiling; attribute vec3 color;
    varying vec3 vC; varying float vK;
    void main(){ vC = pow(color, vec3(2.2)); vK = position.z > ceiling ? 0.0 : 1.0;
      vec4 mv = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * mv;
      gl_PointSize = clamp(voxel * 1.3 * heightPx * 0.5 * projectionMatrix[1][1] / max(-mv.z, 0.05), 1.0, 48.0); }`,
  fragmentShader: `varying vec3 vC; varying float vK;
    void main(){ if (vK < 0.5) discard; vec2 d = gl_PointCoord - 0.5; if (dot(d,d) > 0.25) discard;
      gl_FragColor = vec4(vC, 1.0);
      #include <colorspace_fragment>
    }`,
});
scene.add(new THREE.Points(g, mat));
$('tCeil').value = ov.ceiling_m || 2.2; $('ceilv').textContent = `${(+$('tCeil').value).toFixed(1)} m`;
$('tCeil').oninput = (e) => { mat.uniforms.ceiling.value = +e.target.value; $('ceilv').textContent = `${(+e.target.value).toFixed(1)} m`; };

// --- robot path + start
if (m > 1) {
  const p = new Float32Array(cam); for (let i = 2; i < p.length; i += 3) p[i] = 0.02;
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Line(lg, new THREE.LineBasicMaterial({ color: 0xc3c2b7 })));
}
if (m) {
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 1.3, 24),
    new THREE.MeshBasicMaterial({ color: 0x3987e5, transparent: true, opacity: 0.45 }));
  r.rotation.x = Math.PI / 2; r.position.set(cam[0], cam[1], 0.65); scene.add(r);
}
const grid = new THREE.GridHelper(30, 30, 0x383835, 0x2c2c2a); grid.rotation.x = Math.PI / 2; scene.add(grid);

// --- lidar occupancy (walls) on the floor
const occGroup = new THREE.Group(); scene.add(occGroup);
if (ov.occupancy) {
  const o = ov.occupancy;
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = o.w; cv.height = o.h;
    const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0);
    const id = cx.getImageData(0, 0, o.w, o.h), d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i] < 64) { d[i] = 0xc3; d[i + 1] = 0xc2; d[i + 2] = 0xb7; d[i + 3] = 220; } else d[i + 3] = 0;
    }
    cx.putImageData(id, 0, 0);
    const tex = new THREE.CanvasTexture(cv); tex.flipY = false; tex.magFilter = THREE.NearestFilter;
    const w = o.w * o.res, h = o.h * o.res;
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
    const uv = pl.geometry.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - uv.getY(i));
    pl.position.set(o.origin[0] + w / 2, o.origin[1] + h / 2, 0.01);
    occGroup.add(pl);
  };
  img.src = 'scene/occupancy.png';
}
$('tOcc').onchange = (e) => { occGroup.visible = e.target.checked; };

// --- posture heat map: mean REBA per floor cell (diverging blue <-> gray <-> red)
// --- scene graph: furniture boxes with labels, coloured by class (scene/scene_graph.json)
const graphGroup = new THREE.Group(); scene.add(graphGroup);
try {
  const r = await fetch('scene/scene_graph.json');
  if (r.ok) {
    const sg = await r.json();
    const COL = { table: 0x3987e5, chair: 0xe66767, sofa: 0x9b6bd6, bed: 0x9b6bd6, cabinet: 0x19a979, low_object: 0x8a8a8a, screen: 0xfab219 };
    for (const b of sg.boxes || []) {
      if (b.label === 'object' || b.label === 'tall_object') continue;
      const [l, w, h] = b.s, c = Math.cos(b.yaw), s = Math.sin(b.yaw);
      const at = (u, v, z) => new THREE.Vector3(b.c[0] + c * u - s * v, b.c[1] + s * u + c * v, z);
      const P = [[l / 2, w / 2], [-l / 2, w / 2], [-l / 2, -w / 2], [l / 2, -w / 2]], seg = [];
      for (let i = 0; i < 4; i++) { const [a0, b0] = P[i], [a1, b1] = P[(i + 1) % 4]; seg.push(at(a0, b0, 0.02), at(a1, b1, 0.02), at(a0, b0, h), at(a1, b1, h), at(a0, b0, 0.02), at(a0, b0, h)); }
      graphGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(seg),
        new THREE.LineBasicMaterial({ color: COL[b.label] || 0x8a8a8a, transparent: true, opacity: 0.7 })));
    }
    const parts = Object.entries(sg.summary || {}).filter(([k]) => !['object', 'tall_object', 'wall'].includes(k)).map(([k, n]) => `${n} ${k.replace('_', ' ')}`);
    $('graphinfo').textContent = `scene graph: ${parts.join(', ')} · ${(sg.edges || []).length} relations`;
  }
} catch (e) { /* older session: no scene graph */ }
$('tGraph').onchange = (e) => { graphGroup.visible = e.target.checked; };

const heatGroup = new THREE.Group(); scene.add(heatGroup);
const heat = ov.heat || { cells: [] };
if (heat.cells && heat.cells.length) {
  const im = new THREE.InstancedMesh(new THREE.PlaneGeometry(heat.cell * 0.94, heat.cell * 0.94),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.8, depthWrite: false }), heat.cells.length);
  const M = new THREE.Matrix4(), C = new THREE.Color();
  heat.cells.forEach((c, i) => { M.makeTranslation(c.x, c.y, 0.07); im.setMatrixAt(i, M); im.setColorAt(i, C.set(c.color)); });
  heatGroup.add(im);
  const L = heat.legend;
  $('legend').innerHTML = `<div style="margin-top:8px"><b>Posture heat map</b> <span class="muted">mean REBA where the person was</span></div>
    <div class="ramp">${L.ramp.map((c) => `<i style="background:${c}"></i>`).join('')}</div>
    <div class="rl"><span>better (REBA 1)</span><span>${L.mid}</span><span>worse (9+)</span></div>`;
} else $('legend').innerHTML = '<div class="muted" style="margin-top:8px">No posture heat map (no registered person track in this session).</div>';
$('tHeat').onchange = (e) => { heatGroup.visible = e.target.checked; };

// --- captions: pins in the scene + labels projected on screen + a numbered list
const caps = (ov.captions || []).filter((c) => c.pos);
const pinGroup = new THREE.Group(); scene.add(pinGroup);
const labels = [];
caps.forEach((c, k) => {
  const top = Math.max(c.pos[2] + 0.6, 1.8) + (c.lift || 0);
  const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(c.pos[0], c.pos[1], 0.02), new THREE.Vector3(c.pos[0], c.pos[1], top)]);
  pinGroup.add(new THREE.Line(lg, new THREE.LineBasicMaterial({ color: c.color })));
  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.08, 24), new THREE.MeshBasicMaterial({ color: c.color }));
  dot.position.set(c.pos[0], c.pos[1], 0.09); pinGroup.add(dot);
  const el = document.createElement('div');
  el.className = 'cap'; el.style.borderColor = c.color;
  const ink = c.level === 'warning' ? '#0b0b0b' : '#fff';
  el.innerHTML = `<span class="num" style="background:${c.color};color:${ink}">${c.id}</span><span class="t"> ${c.icon} <b>${esc(c.title)}</b></span><small>${esc(c.text || '')}</small>`;
  document.body.appendChild(el);
  el.onclick = () => focus(c);
  const prio = { critical: 0, warning: 2, good: 1, serious: 3 }[c.level] ?? 4;
  labels.push({ el, c, p: new THREE.Vector3(c.pos[0], c.pos[1], top), prio });
  const li = document.createElement('li');
  const t = c.t ? new Date(c.t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  li.innerHTML = `<span class="num" style="background:${c.color};color:${ink}">${c.id}</span><span><span class="muted">${t}</span> ${c.icon} ${esc(c.title)} <span class="muted">${esc(c.text || '')}</span></span>`;
  li.onclick = () => focus(c);
  $('caps').appendChild(li);
});
if (!caps.length) $('caps').innerHTML = '<li class="muted">No alerts or coaching moments to caption.</li>';
function esc(s) { return String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
$('tCap').onchange = (e) => { pinGroup.visible = e.target.checked; labels.forEach((l) => { l.el.style.display = e.target.checked ? '' : 'none'; }); };

// --- orbit camera (small, dependency-free): frame the bulk of the room (5th-95th percentile, not stray points)
const pct = (k, q) => { const a = []; for (let i = k; i < xyz.length; i += 3 * Math.max(1, Math.floor(n / 20000))) a.push(xyz[i]); a.sort((u, w) => u - w); return a[Math.floor(q * (a.length - 1))] || 0; };
const bb = { min: { x: pct(0, 0.05), y: pct(1, 0.05) }, max: { x: pct(0, 0.95), y: pct(1, 0.95) } };
const target = new THREE.Vector3((bb.min.x + bb.max.x) / 2, (bb.min.y + bb.max.y) / 2, 0.6);
let radius = Math.max(4, Math.hypot(bb.max.x - bb.min.x, bb.max.y - bb.min.y) * 1.3), az = -Math.PI / 2 - 0.5, el = 0.85;
function place() {
  camera.position.set(target.x + radius * Math.cos(el) * Math.cos(az), target.y + radius * Math.cos(el) * Math.sin(az), target.z + radius * Math.sin(el));
  camera.lookAt(target);
}
function focus(c) { target.set(c.pos[0], c.pos[1], 0.8); radius = 3.2; place(); }
place();
let drag = null;
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button }; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 2 || e.shiftKey) {
    const s = radius * 0.0015;
    target.x += (-dx * Math.sin(az) - dy * Math.cos(az)) * s; target.y += (dx * Math.cos(az) - dy * Math.sin(az)) * s;
  } else { az -= dx * 0.006; el = Math.min(1.5, Math.max(0.05, el + dy * 0.006)); }
  place();
});
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); radius = Math.min(60, Math.max(0.8, radius * Math.exp(e.deltaY * 0.001))); place(); }, { passive: false });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); mat.uniforms.heightPx.value = innerHeight; });
const v = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  renderer.render(scene, camera);
  const show = $('tCap').checked;
  // declutter: alarms first, then improvements, then newest; a label that would overlap one already placed
  // shrinks to its numbered badge (hover to read it)
  const placed = [];
  [...labels].sort((a, b) => a.prio - b.prio || (b.c.t || 0) - (a.c.t || 0)).forEach((l) => {
    v.copy(l.p).project(camera);
    const vis = show && v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    l.el.style.display = vis ? '' : 'none';
    if (!vis) return;
    const x = (v.x + 1) / 2 * innerWidth, y = (1 - v.y) / 2 * innerHeight;
    const r = { x0: x - 130, x1: x + 130, y0: y - 52, y1: y };
    const hit = placed.some((q) => !(r.x1 < q.x0 || r.x0 > q.x1 || r.y1 < q.y0 || r.y0 > q.y1));
    l.el.classList.toggle('compact', hit);
    if (!hit) placed.push(r);
    l.el.style.left = `${x}px`; l.el.style.top = `${y}px`;
    l.el.style.zIndex = String(hit ? 100 : 1000 - Math.round(v.z * 500));
  });
});
window.__scene = { camera, focus, caps, view: (a, e, r, tx, ty) => { az = a; el = e; radius = r; if (tx != null) target.set(tx, ty, 0.6); place(); } };
</script>
</body>
</html>
