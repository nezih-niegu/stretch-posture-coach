<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene 3-D view</title>
<style>
  html,body{margin:0;height:100%;background:#101216;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
  #info{position:fixed;top:10px;left:12px;font-size:14px;line-height:1.5;background:rgba(16,18,22,.75);
    padding:8px 12px;border-radius:8px;max-width:46ch}
  #info b{color:#fff} a{color:#7fb2f0}
  .k{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}
</style>
<script type="importmap">{"imports": {"three": "/vendor/three.module.js"}}</script>
</head>
<body>
<div id="info"><b>Static scene map</b> (people removed) · <span id="n">loading…</span><br>
  drag = orbit · right-drag = pan · wheel = zoom · <a href="./">back to report</a><br>
  <span class="k" style="background:#222"></span>Stretch path
  <span class="k" style="background:#eb6834"></span>where the person was
  <span class="k" style="background:#666"></span>1 m grid on the floor</div>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101216);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 200);
camera.up.set(0, 0, 1);  // map frame: z up

const res = await fetch('scene/points.bin');
if (!res.ok) { document.getElementById('n').textContent = 'no scene map for this session'; throw new Error('no map'); }
const buf = await res.arrayBuffer();
const dv = new DataView(buf);
let off = 0;
const n = dv.getUint32(off, true); off += 4;
const xyz = new Float32Array(buf, off, n * 3); off += n * 12;
const rgb = new Uint8Array(buf, off, n * 3); off += n * 3; off += (4 - (n * 3) % 4) % 4;
const m = dv.getUint32(off, true); off += 4;
const cam = new Float32Array(buf, off, m * 3); off += m * 12;
const k = dv.getUint32(off, true); off += 4;
const person = new Float32Array(buf, off, k * 3);
document.getElementById('n').textContent = `${n.toLocaleString()} voxels`;

const g = new THREE.BufferGeometry();
g.setAttribute('position', new THREE.BufferAttribute(xyz, 3));
const col = new Float32Array(n * 3);
for (let i = 0; i < n * 3; i++) col[i] = rgb[i] / 255;
g.setAttribute('color', new THREE.BufferAttribute(col, 3));
const cloud = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.05, vertexColors: true, sizeAttenuation: true }));
scene.add(cloud);

function line(arr, color, width) {
  if (arr.length < 6) return;
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Line(lg, new THREE.LineBasicMaterial({ color, linewidth: width })));
}
// robot path drawn on the floor; person track at torso height
const camFloor = new Float32Array(cam);
for (let i = 2; i < camFloor.length; i += 3) camFloor[i] = 0.01;
line(camFloor, 0xdddddd, 2);
line(person, 0xeb6834, 2);
for (let i = 0; i < k; i += Math.max(1, Math.floor(k / 60))) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), new THREE.MeshBasicMaterial({ color: 0xeb6834 }));
  s.position.set(person[3 * i], person[3 * i + 1], person[3 * i + 2]);
  scene.add(s);
}
if (m) {
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 1.3, 24),
    new THREE.MeshBasicMaterial({ color: 0x2a2a2a, transparent: true, opacity: 0.7 }));
  r.rotation.x = Math.PI / 2;
  r.position.set(cam[0], cam[1], 0.65);
  scene.add(r);
}
const grid = new THREE.GridHelper(20, 20, 0x555555, 0x333333);
grid.rotation.x = Math.PI / 2;
scene.add(grid);

// orbit controls (small, dependency-free)
g.computeBoundingBox();
const bb = g.boundingBox;
const target = new THREE.Vector3().addVectors(bb.min, bb.max).multiplyScalar(0.5);
target.z = 0.6;
let radius = Math.max(4, bb.max.distanceTo(bb.min) * 0.9), az = -Math.PI / 2 - 0.5, el = 0.75;
function place() {
  camera.position.set(target.x + radius * Math.cos(el) * Math.cos(az), target.y + radius * Math.cos(el) * Math.sin(az),
    target.z + radius * Math.sin(el));
  camera.lookAt(target);
}
place();
let drag = null;
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button }; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 2 || e.shiftKey) {  // pan in the floor plane
    const s = radius * 0.0015;
    target.x += (-dx * Math.sin(az) - dy * Math.cos(az)) * s;
    target.y += (dx * Math.cos(az) - dy * Math.sin(az)) * s;
  } else {
    az -= dx * 0.006;
    el = Math.min(1.5, Math.max(0.05, el + dy * 0.006));
  }
  place();
});
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  radius = Math.min(60, Math.max(0.8, radius * Math.exp(e.deltaY * 0.001)));
  place();
}, { passive: false });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
