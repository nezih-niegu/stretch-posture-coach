<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stretch telepresence (VR)</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
  #ui{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:2}
  button{font-size:20px;padding:12px 22px;border-radius:10px;border:0;background:#2a78d6;color:#fff}
  button:disabled{background:#444;color:#999}
  #msg{font-size:15px;opacity:.9;max-width:60ch}
  a{color:#7fb2f0;font-size:15px}
  #help{position:fixed;bottom:10px;left:12px;font-size:13px;opacity:.6}
  #alarm{display:none;position:fixed;top:70px;left:12px;right:12px;z-index:3;padding:16px;border-radius:10px;
    background:#d03b3b;color:#fff;font-size:20px}
  #alarm.check{background:#c77700}
  #alarm button{margin-left:14px;background:#fff;color:#900;font-weight:700}
</style>
<script type="importmap">{"imports": {"three": "/vendor/three.module.js"}}</script>
</head>
<body>
<div id="ui">
  <button id="enter" disabled>Enter VR</button>
  <span id="msg">connecting…</span>
  <a href="/sessions" target="_blank">Reports</a>
</div>
<div id="alarm"><b id="atitle"></b> <span id="areason"></span>
  <button id="ack">I'm OK / acknowledge</button></div>
<div id="help">Drag to look around. In VR: trigger = recenter the live view in front of you ·
  A/X = robot head follows your head on/off · B/Y = scene memory on/off · grip = acknowledge a fall alarm</div>
<script type="module" src="/vr.js"></script>
</body>
</html>
