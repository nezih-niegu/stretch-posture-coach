# Default configuration for stretch-posture-coach.
# Copy to ./config.yaml (or pass --config FILE) and override only what you need;
# user values are deep-merged on top of these defaults.

camera:
  source: realsense        # realsense | webcam | <path to video file>
  realsense_name: "D435"   # substring of the RealSense device name (head cam on Stretch 3 is a D435i; the D405 is the gripper cam)
  webcam_index: 0          # used when source == webcam (Stretch 3 nav camera is usually /dev/video6+, check `v4l2-ctl --list-devices`)
  width: 640
  height: 480
  fps: 30
  rotate: cw90             # Stretch head camera is mounted sideways. cw90 | ccw90 | 180 | none
  height_m: 1.3            # head camera height above the floor (fall detection hip height, VR floor)
  pitch_deg: 0.0           # camera pitch (down = negative) used for gravity when robot head tilt is unavailable
  depth: true              # RealSense depth (aligned to color) -> distance to the person for follow mode

pose:
  model: full              # lite | full | heavy  (full runs ~20-30 FPS on the NUC12 i5)
  models_dir: models
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  min_visibility: 0.5      # landmarks below this visibility are ignored

subject:
  body_mass_kg: 70.0       # used by the biomechanical load model
  hand_load_kg: 0.0        # load held in EACH hand (e.g. lifting a box: total / 2)
  arms_supported: false    # true if forearms rest on a desk / armrest (RULA/REBA -1 upper arm)

analysis:
  smoothing_alpha: 0.35    # EMA on metrics (0..1, higher = less smoothing)
  static_posture_s: 60     # posture held > this -> RULA muscle-use / REBA activity +1
  calibration_file: calibration.json

# Thresholds for the coaching rules. Angles in degrees, distances in cm, forces in N.
thresholds:
  neck_flexion: 20         # head forward/down relative to trunk
  neck_extension: 10       # head tilted back
  neck_side_bend: 12
  neck_twist: 25
  trunk_flexion: 20        # leaning / slouching forward
  trunk_extension: 15      # leaning back while standing
  trunk_side_bend: 10
  trunk_twist: 15
  shoulder_tilt_cm: 4      # one shoulder higher than the other
  upper_arm_elevation: 60  # arms raised
  l5s1_compression_n: 3400 # NIOSH action limit
  rula_high: 5             # RULA >= this is flagged
  reba_high: 8             # REBA >= this is flagged
  hold_s: 6                # a rule must be violated this long before Stretch speaks

coach:
  enabled: true
  language: English        # language the robot speaks (e.g. English, Spanish)
  persona: default         # default | norteno  (norteno = Spanish from the Sierra of Sonora/Chihuahua)
  robot_name: Stretch
  user_name: ""            # optional, the coach will use it sometimes
  min_interval_s: 25       # minimum time between any two spoken messages
  repeat_interval_s: 75    # minimum time before coaching the same issue again
  praise: true             # say something short when you fix an issue after being coached
  praise_window_s: 20
  break_reminder_min: 30   # remind to stand up / move after this long in view (0 = off)
  greet: true

llm:
  enabled: true
  host: http://localhost:11434   # Ollama on the robot; point to your laptop's IP to use a bigger model there
  model: qwen2:1.5b              # qwen2:0.5b | qwen2:1.5b | qwen2:7b
  temperature: 0.6
  max_tokens: 70
  timeout_s: 20
  keep_alive: 30m

speech:
  enabled: true
  engine: auto             # auto | piper | espeak | print
  piper_voice: en_US-lessac-medium   # Spanish: es_MX-claude-high
  voices_dir: models/piper
  espeak_voice: en-us      # Spanish: es-419
  rate_wpm: 165
  volume: 1.0

robot:
  enabled: auto            # auto | true | false  (auto = only if stretch_body is importable)
  python: /usr/bin/python3 # system python that has Hello Robot's stretch_body installed
  head_tracking: true      # keep your torso centered with the head pan/tilt
  initial_pan: null        # radians, null = leave head where it is
  initial_tilt: null
  track_hz: 4
  deadband: 0.08           # fraction of the image (no motion if target is within this of center)
  gain: 0.5
  max_step_rad: 0.12
  pan_sign: -1             # flip to +1 if the head turns AWAY from you
  tilt_sign: -1            # flip to +1 if the head tilts the wrong way
  hfov_deg: 42             # horizontal FOV of the (rotated) head camera image
  vfov_deg: 69
  front_tilt_rad: -0.15    # "looking to the front": head tilt at start, after the survey, and VR look zero
                           # (the front pan is follow.forward_pan_rad)

# 360° survey at the start of EVERY session (mode SURVEY): new lidar SLAM map, floor-plane recalibration,
# head sweep of the room, optional base spin guarded by the control barrier functions. Then coaching starts.
survey:
  enabled: true
  pan_min_rad: -3.9        # head sweep range (Stretch head pan is about -4.0 .. 1.9 rad)
  pan_max_rad: 1.6
  steps: 10
  tilt_rad: -0.55          # looking down enough to see the floor (floor-plane calibration)
  dwell_s: 1.2             # pause at each step (keyframes land in the map)
  settle_s: 1.5
  rotate_base: auto        # auto = spin 360° only if a lidar is present and the barriers allow it | true | false
  spin_step_deg: 30
  spin_dwell_s: 2.8
  min_voxels: 1500         # survey "OK" needs this much mapped room
  timeout_s: 90

# Control Barrier Functions for the mobile base: every lidar return is a barrier h = |c - o|^2 - d^2 on two
# circles covering the footprint; base commands (expert joysticks, follow steps, survey spin) are minimally
# changed so that dh/dt >= -alpha * h (smooth stop at the barrier, turning away / backing off stays free).
# The keep-out lines (h = 0) are drawn in the VR scene.
safety:
  enabled: true
  circle_offset_m: 0.08    # footprint circles at +-0.08 m along the base axis ...
  circle_radius_m: 0.21    # ... with this radius
  margin_m: 0.20           # extra clearance to any obstacle (d = radius + margin)
  alpha: 1.5               # 1/s: how fast the robot may approach a barrier (smaller = more cautious)
  turn_weight: 0.15        # the filter prefers changing the turn rate over the speed
  range_m: 2.5             # obstacles considered
  cell_m: 0.08
  max_constraints: 24

# Follow mode: Stretch turns its body to face you and keeps a safe distance using the mobile base.
# OFF by default; enable with `posture-coach follow` or `posture-coach run --follow`.
# Clear the floor between you and the robot and behind it. Keep the runstop (button on the head) in reach.
follow:
  enabled: false
  target_m: 2.5            # preferred distance
  min_m: 2.0               # closer than this -> back off (never approaches closer than this)
  max_m: 3.0               # farther than this -> approach
  emergency_m: 1.2         # closer than this -> back off a full step immediately
  forward_pan_rad: 0.0     # head pan at which the camera looks straight ahead of the base
  align_tol_deg: 12        # turn the body when you are more than this off-center
  max_rotate_step_deg: 20  # largest single turn
  max_translate_step_m: 0.15  # largest single forward/back step
  rotate_speed_rad_s: 0.3  # used to wait for a step to finish (robot_helper caps speeds too)
  translate_speed_m_s: 0.08
  settle_s: 0.6            # pause after each step
  stable_frames: 6         # consecutive detections required before moving
  max_backoff_total_m: 1.0 # max total backing up (no rear sensor!) until it moves forward again
  max_travel_m: 3.0        # never wander farther than this from where it started
  announce: true           # say something when backing off / when the back-up limit is reached

display:
  window: auto             # auto | true | false  (auto = only if $DISPLAY is set)
  stream: true             # MJPEG viewer at http://<robot>:<port>/
  stream_host: 0.0.0.0
  stream_port: 8080
  jpeg_quality: 75
  serve_report: true       # after the session, keep the web server up showing the report (Ctrl+C to quit)

# Fall detection: rapid descent + ending up lying -> Stretch asks "are you OK?" -> alarm if no recovery.
fall:
  enabled: true
  drop_m: 0.45             # hips drop this much (depth camera)...
  drop_window_s: 1.2       # ...within this time
  descent_torso_lengths: 1.0  # or hips move down this many torso lengths in the image (no depth needed)
  lying_incl_deg: 55       # trunk this far from vertical = lying (0 upright, 90 horizontal)
  lying_hip_m: 0.65        # and hips below this height (when depth is available)
  upright_incl_deg: 35     # recovery: trunk back within this of vertical...
  upright_hip_m: 0.45      # ...with hips above this
  settle_s: 3.0            # after a rapid descent, time to end up lying (else: just sat down)
  check_s: 12              # "are you OK?" window before the alarm
  recover_s: 3             # upright this long = OK
  hand_raise_ok: true      # raising a hand during the check = "I'm OK"
  hand_ok_s: 1.5
  floor_height_m: 0.45     # lying with hips below this = on the floor
  long_lying_s: 30         # on the floor this long, even without a seen fall -> check (0 = off)
  quiet_after_s: 30        # no posture tips for this long after a fall check/alarm clears
  quiet_lying_s: 10        # ...and while someone is lying down (+ this long after)

alarm:
  siren: true              # loud two-tone siren through the robot speaker
  volume: 1.5              # paplay volume (1.0 = 100 %)
  repeat_s: 4              # pause between siren + spoken alert cycles
  max_duration_s: 600      # stop the siren after this (the alarm stays visible on the web/VR)
  notify_on_check: true    # phone push "possible fall" as soon as Stretch asks "are you OK?" (urgent at the alarm)
  ntfy_topic: ""           # phone push: install the ntfy app, subscribe to a hard-to-guess topic, put it here
  ntfy_server: https://ntfy.sh
  force_ipv4: true         # send notifications over IPv4 (the robot's network has broken IPv6)
  webhook_url: ""          # optional: POST JSON {event, reason, time, live_url} here (Slack/Teams/Home Assistant...)

# Scene understanding: RGB-D keyframes + joint states are recorded with each session; the report builds a
# static 3-D map of the room (people removed), where the person was and the free space around them.
# The same recording can be exported to OneSLAM (camera-only SLAM, runs on a GPU machine).
scene_graph:
  # Layered 3-D scene graph (room -> objects -> person/robot -> events) built from the live map.
  # Used for coaching context, fall checks (sofa/bed is not the floor; names the furniture), captions and VR.
  enabled: true
  rebuild_s: 5.0              # re-segment the object layer this often (map thread)
  cell_m: 0.05
  floor_z_m: 0.08
  min_area_m2: 0.04
  max_object_z_m: 2.0         # ignore voxels above this (ceilings, lamps) when segmenting
  support_margin_m: 0.15      # the person is "on" an object if the hips are within this of its footprint
  near_m: 0.8
  event_object_m: 1.0         # attach an event to an object within this distance, else to the floor
  # optional semantic labels: MediaPipe EfficientDet-Lite0 (COCO); `posture-coach download-models` fetches it.
  # "auto" = use it if the file exists. Geometric labels are used otherwise.
  detector: auto
  detector_model: null        # default: $POSTURE_COACH_HOME/models/efficientdet_lite0.tflite
  detector_score: 0.4
  detector_every_keyframes: 3
  min_votes: 3

scene:
  record: true
  record_hz: 1             # keyframes per second (use 10 for sessions you want to run through OneSLAM)
  depth_decimation: 2      # store depth at 1/2 resolution (240x320)
  jpeg_quality: 85
  max_frames: 3600         # per session (1 h at 1 Hz, ~350 MB)
  voxel_m: 0.05            # map resolution
  map_stride: 2            # use every 2nd depth pixel when fusing
  min_hits: 2              # a voxel must be seen twice to be kept (noise / moving things)
  max_map_frames: 600      # frames fused into the map (evenly sampled)
  person_radius_m: 0.35    # carve this radius around where people stood out of the static map
  pan_axis_x: 0.0          # head pan axis position in the base frame (m) - approximate
  pan_axis_y: 0.0
  camera_forward_m: 0.05   # camera optical centre ahead of the pan axis
  floor_align: true        # measure head-tilt offset, camera roll and height from the floor plane (fixes
                           # "stacked floors" / slanted ceilings in the map)
  tilt_offset_deg: 0.0     # starting values (refined online when the floor is visible)
  roll_offset_deg: 0.0
  height_offset_m: 0.0

# Base lidar (RPLidar A1 on Stretch 3): 2-D SLAM gives drift-free base poses -> registered VR scan + scene map,
# and the collision guard for expert teleop. Check the mounting with `posture-coach lidar-test`.
lidar:
  enabled: auto            # auto (use it if the port exists) | true | false
  port: /dev/hello-lrf
  baud: 115200
  yaw_offset_deg: 180      # laser frame yaw in base_link (Stretch: 180)
  clockwise: true          # RPLidar angles grow clockwise seen from above
  x: 0.0                   # laser position in base_link (m)
  y: 0.0
  min_range_m: 0.25        # ignore returns from the robot's own body
  max_range_m: 10.0
  map_res_m: 0.05
  map_size_m: 40.0
  min_score: 0.35          # scan-match quality below this -> trust wheel odometry for that scan
  map_update_m: 0.10       # add a scan to the map after moving this far / turning this much
  map_update_deg: 5

# Expert teleoperation from the VR page (Meta Quest): arm by hand tracking, base by joystick, gripper A/B with
# haptic feedback. Overrides follow mode while active. One expert at a time, unlocked with a PIN.
teleop:
  enabled: true
  require_pin: true
  pin: ""                  # empty = a new random 6-digit PIN each run (printed in the log)
  max_speed_m_s: 0.25      # base, full joystick deflection
  max_turn_rad_s: 0.6
  command_timeout_s: 0.4   # no fresh command from the headset -> stop
  rate_hz: 20
  hand_scale: 1.0          # gripper moves this many metres per metre of hand motion
  precision_scale: 0.3     # ...while the right trigger is held
  arm_axis_sign: -1        # Stretch's arm extends along -y of the base; flip to +1 if extension is reversed
  wrist_gains: [1.0, 1.0, 1.0]   # yaw, pitch, roll
  gripper_open_pct: 50
  gripper_close_pct: -100  # closes until it stalls on the object (stretch_body limits the force)
  gripper_effort_free: 8   # gripper motor effort (%) with nothing in it ...
  gripper_effort_full: 60  # ... and at a firm grasp -> full vibration
  arm_effort_free: 25      # lift / arm effort (%) -> vibration on contact
  arm_effort_full: 70
  lidar_guard: true        # emergency stop layer under the CBF filter (safety:)
  footprint_half_length_m: 0.20
  footprint_half_width_m: 0.20
  stop_distance_m: 0.12
  slow_distance_m: 0.05

# Talk through Stretch from the headset: hold the LEFT TRIGGER (push-to-talk) -> offline speech-to-text
# (faster-whisper) -> the LLM turns the expert's words into what Stretch says (persona + language) -> the
# robot's voice. Expert (PIN) only.
voice:
  enabled: true
  mode: relay              # relay = through the LLM | verbatim = speak the transcript as said
  stt_model: base          # tiny | base | small (better Spanish, ~2x slower) | medium
  language: auto           # auto = from the persona (es / en)
  threads: 4
  partial_every_s: 1.0     # live transcript in the headset while talking
  max_utterance_s: 30
  max_tokens: 90

# VR telepresence for the Meta Quest browser: https://<robot>:8443/  (accept the certificate warning once)
vr:
  enabled: true
  host: 0.0.0.0
  port: 8443
  https: true              # WebXR needs https; a self-signed certificate is generated in certs/
  certs_dir: certs
  fps: 15                  # RGB-D frames per second sent to the headset (rendering runs at 72-120 Hz anyway)
  depth_decimation: 4      # 480x640 color -> 120x160 depth grid (3-D surface resolution)
  jpeg_quality: 70
  max_range_m: 4.5         # depth beyond this is too noisy on the D435 -> dropped
  camera_height_m: 1.3     # robot head camera height above the floor (draws the floor grid)
  head_control: true       # in VR the robot head follows your head (toggle with A/X)
  gripper_camera: auto     # D405 on the gripper as a floating panel (auto | false)
  gripper_name: D405
  gripper_rotate: none
  aux_fps: 10
  nav_camera: auto         # wide-angle head camera as a panel (auto | /dev/videoN | false)
  nav_name: "vitade|navigation|wide|arducam"
  nav_rotate: ccw90        # the Stretch 3 wide-angle head camera is mounted sideways
  nav_hfov_deg: 120
  nav_vfov_deg: 90
  nav_width: 800
  nav_height: 600
  look_yaw_sign: 1         # VR head following: your rotation since entering VR is added to the robot's "front"
  look_pitch_sign: 1       # (front = follow.forward_pan_rad, robot.front_tilt_rad); flip a sign if it's reversed
  gripper_depth: true      # gripper D405 as RGB-D (immersive gripper view); false = color panel only
  gripper_max_range_m: 0.8
  map_hz: 2                # RGB-D frames fused into the registered room scan per second
  map_voxel_m: 0.05
  map_stride: 4            # use every 4th depth pixel (160x120 from 640x480)
  map_min_hits: 2          # a voxel shows once seen twice (noise)
  map_max_voxels: 400000
  map_carve: true          # remove voxels the camera now sees through (moved furniture, people)
  map_person_radius_m: 0.3 # and a column around the person
  map_ceiling_m: 2.2       # the headset hides the map above this (toggle in VR)
  heat_cell_m: 0.25        # posture heat map cell size

logging:
  enabled: true
  sessions_dir: sessions
  log_hz: 5
